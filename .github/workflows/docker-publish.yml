name: Build and Publish Container Images

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/openmail-backend
  IMAGE_POSTFIX: ghcr.io/${{ github.repository_owner }}/openmail-postfix
  IMAGE_DOVECOT: ghcr.io/${{ github.repository_owner }}/openmail-dovecot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build and push Postfix Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/postfix/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_POSTFIX }}:latest
            ${{ env.IMAGE_POSTFIX }}:${{ github.sha }}

      - name: Build and push Dovecot Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dovecot/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_DOVECOT }}:latest
            ${{ env.IMAGE_DOVECOT }}:${{ github.sha }}
