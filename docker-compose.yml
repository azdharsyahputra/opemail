services:
  postgres:
    image: postgres:16-alpine
    container_name: mailopen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailopen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailopen}
      POSTGRES_DB: ${POSTGRES_DB:-mailopen}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailopen} -d ${POSTGRES_DB:-mailopen}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmail-backend:latest
    container_name: mailopen_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mailopen}:${POSTGRES_PASSWORD:-mailopen}@postgres:5432/${POSTGRES_DB:-mailopen}?sslmode=disable
      POSTFIX_DB_HOST: postgres
      POSTFIX_DB_PORT: 5432
      DOVECOT_DB_HOST: postgres
      DOVECOT_DB_PORT: 5432
      VMAIL_ROOT: /var/vmail
      VMAIL_DIR: /var/vmail
      TLS_BASE_DIR: /etc/mailopen/tls
      DKIM_BASE_DIR: /etc/mailopen/dkim
      STORAGE_PATH: /var/mailopen/blobs
      POSTFIX_HOSTNAME: ${POSTFIX_HOSTNAME:-mail.example.com}
      TLS_HOSTNAME: ${POSTFIX_HOSTNAME:-mail.example.com}
      TLSHOSTNAME: ${POSTFIX_HOSTNAME:-mail.example.com}
    ports:
      - "${API_PORT:-8085}:8085"
    volumes:
      - ./data/vmail:/var/vmail
      - ./data/tls:/etc/mailopen/tls
      - ./data/dkim:/etc/mailopen/dkim
      - ./data/postfix:/data/postfix
      - ./data/dovecot:/data/dovecot
      - ./data/blobs:/var/mailopen/blobs
    depends_on:
      postgres:
        condition: service_healthy

  panel:
    image: ghcr.io/azdharsyahputra/openmail-panel:latest
    container_name: mailopen_panel
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8085
    ports:
      - "${PANEL_PORT:-3000}:3000"
    depends_on:
      - backend

  postfix:
    build:
      context: .
      dockerfile: deploy/postfix/Dockerfile
    image: openmail-postfix:latest
    container_name: mailopen_postfix
    restart: unless-stopped
    ports:
      - "25:25"
      - "587:587"
    volumes:
      - ./data/vmail:/var/vmail
      - ./data/postfix:/config
      - ./data/tls:/etc/mailopen/tls:ro
      - ./data/dkim:/etc/mailopen/dkim:ro
      - ./data/opendkim:/etc/mailopen/opendkim:ro
      - postfix_private:/var/spool/postfix/private
    depends_on:
      postgres:
        condition: service_healthy

  dovecot:
    build:
      context: .
      dockerfile: deploy/dovecot/Dockerfile
    image: openmail-dovecot:latest
    container_name: mailopen_dovecot
    restart: unless-stopped
    ports:
      - "143:143"
      - "993:993"
    volumes:
      - ./data/vmail:/var/vmail
      - ./data/dovecot:/config
      - ./data/tls:/etc/mailopen/tls:ro
      - postfix_private:/var/spool/postfix/private
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  postfix_private:
