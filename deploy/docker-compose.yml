services:
  postgres:
    image: postgres:16-alpine
    container_name: mailopen_postgres
    environment:
      POSTGRES_USER: mailopen
      POSTGRES_PASSWORD: mailopen
      POSTGRES_DB: mailopen
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailopen -d mailopen"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
